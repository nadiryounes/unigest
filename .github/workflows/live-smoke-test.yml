name: Live smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-smoke-test.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test frontend
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/frontend.html -w "%{http_code}" https://unigest-web.vercel.app/)
          echo "frontend_status=$code"
          test "$code" = "200"
          grep -qi "UniGest" /tmp/frontend.html

      - name: Test health
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" https://unigest-api.vercel.app/health)
          echo "health_status=$code"
          cat /tmp/health.json
          test "$code" = "200"

      - name: Test CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D /tmp/headers.txt -o /dev/null -X OPTIONS https://unigest-api.vercel.app/auth/login \
            -H 'Origin: https://unigest-web.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
          cat /tmp/headers.txt
          grep -qi '^access-control-allow-origin: https://unigest-web.vercel.app' /tmp/headers.txt

      - name: Test login endpoint reachability
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/login.json -w "%{http_code}" -X POST https://unigest-api.vercel.app/auth/login \
            -H 'Origin: https://unigest-web.vercel.app' \
            -H 'Content-Type: application/json' \
            --data '{"email":"smoketest@example.invalid","password":"not-a-real-password"}')
          echo "login_status=$code"
          cat /tmp/login.json
          test "$code" = "401"

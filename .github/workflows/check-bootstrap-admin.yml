name: Check bootstrap admin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-bootstrap-admin.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured admin
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/admin.json -w "%{http_code}" https://unigest-api.vercel.app/health/bootstrap-admin)
          echo "admin_status=$code"
          cat /tmp/admin.json
          test "$code" = "200"
          jq -e '.configured == true and .userExists == true and .active == true and .role == "ADMIN" and .passwordMatches == true' /tmp/admin.json

      - name: Verify real login flow with configured credentials
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/login.json -w "%{http_code}" https://unigest-api.vercel.app/health/bootstrap-login)
          echo "login_flow_status=$code"
          cat /tmp/login.json
          test "$code" = "200"
          jq -e '.ok == true and .role == "ADMIN" and .userIdPresent == true and .tokenPresent == true' /tmp/login.json

name: Verify UniGest Vercel builds

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-vercel-build.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - name: Build API
        run: npm run build -w apps/api
      - name: Build web
        run: npm run build -w apps/web

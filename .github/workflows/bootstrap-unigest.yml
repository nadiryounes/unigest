name: Bootstrap UniGest v0.4.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-unigest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_*.b64 | tr -d '\n\r' | base64 --decode > /tmp/unigest.zip
          echo "f078fb5f0b7747c75202ebc83889493f9af7d9b3d64c6c2c87c5b58a210bb8a2  /tmp/unigest.zip" | sha256sum -c -
          unzip -t /tmp/unigest.zip >/dev/null

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unigest-extract
          mkdir -p /tmp/unigest-extract
          unzip -q /tmp/unigest.zip -d /tmp/unigest-extract

          SOURCE="/tmp/unigest-extract/unigest-mvp-v0.4.1"
          test -d "$SOURCE"
          test -f "$SOURCE/package.json"
          test -f "$SOURCE/render.yaml"
          test -f "$SOURCE/apps/api/package.json"
          test -f "$SOURCE/apps/web/package.json"

          rsync -a "$SOURCE"/ ./

      - name: Remove transfer scaffolding
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-unigest.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit final project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import UniGest v0.4.1 Cloud Ready"
          git push origin HEAD:main

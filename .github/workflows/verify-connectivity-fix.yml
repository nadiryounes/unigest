name: Verify connectivity fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-connectivity-fix.yml"
      - "apps/api/**"
      - "apps/web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web

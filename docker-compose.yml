services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unigest}
      POSTGRES_USER: ${POSTGRES_USER:-unigest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unigest}
    volumes:
      - unigest_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unigest} -d ${POSTGRES_DB:-unigest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-unigest}
      DATABASE_USER: ${POSTGRES_USER:-unigest}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-unigest}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      API_PORT: 4000
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: uploads
    ports:
      - "4000:4000"
    volumes:
      - unigest_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  unigest_pg:
  unigest_uploads:
